{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm">

                <div class="card-header">
                    <h4 class="mb-0">Edit Vehicle</h4>
                </div>

                <div class="card-body">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Vehicle Name</label>
                            <input type="text" name="vehicle_name" class="form-control" value="{{ vehicle.vehicle_name }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Registration Number</label>
                            <input type="text" name="registration_number" class="form-control" value="{{ vehicle.registration_number }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Vehicle Type</label>
                            <input type="text" name="vehicle_type" class="form-control" value="{{ vehicle.vehicle_type }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Driver Name</label>
                            <input type="text" name="driver_name" class="form-control" value="{{ vehicle.driver_name }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Driver Phone</label>
                            <input type="text" name="driver_phone" class="form-control" value="{{ vehicle.driver_phone }}">
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if vehicle.is_active %}checked{% endif %}>
                            <label class="form-check-label" for="is_active">
                                Vehicle Active
                            </label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'vehicle_list' %}" class="btn btn-secondary">
                                Back
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Update Vehicle
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

{% endblock %}
