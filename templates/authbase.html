<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nyondo Hardware</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    {% load static %}

    <style>
        body {
            margin: 0;
            background: #f8fafc;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            height: 60px;
        }

        .navbar-brand img {
            height: 32px;
        }

        .nav-link {
            font-size: 14px;
        }

        .nav-link.active {
            font-weight: 600;
            color: #ffffff !important;
        }

        /* Messages */
        .messages-container {
            position: absolute;
            top: 70px;
            right: 20px;
            z-index: 1050;
            width: 320px;
        }

        .alert {
            border-radius: 8px;
            font-size: 14px;
        }

        /* Prevent content from hiding under navbar */
        .page-content {
            padding-top: 60px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm fixed-top">
    <div class="container-fluid px-4">

        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="{% static 'images/logo.png' %}" class="me-2" style="height: 50px;">
            <span class="fw-semibold">Nyondo General Hardware</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#authNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="authNavbar">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'login' %}active{% endif %}" 
                       href="{% url 'login' %}">
                        Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'register' %}active{% endif %}" 
                       href="{% url 'register' %}">
                        Register
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<div class="messages-container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
</div>

<div class="page-content">
    {% block content %}
    {% endblock %}
</div>


<div class="text-center text-muted small py-3">
    © {% now "Y" %} Nyondo Hardware
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
